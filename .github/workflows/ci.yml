name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No `version:` — the action reads package.json's `packageManager`, and
      # specifying both is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, unit tests, build, manifest and package guards.
      # The live suite is excluded: it needs a key and spends credits.
      - run: pnpm run check
